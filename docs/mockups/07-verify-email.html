<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Basha Pass — Verify your email</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root,
  [data-bs-theme="light"] {
    --bp-primary: #0F6E7A;
    --bp-primary-rgb: 15, 110, 122;
    --bp-primary-fg: #FFFFFF;
    --bp-primary-soft: #E6F2F4;
    --bp-secondary: #C56B4F;
    --bp-secondary-rgb: 197, 107, 79;
    --bp-ink: #0F172A;
    --bp-ink-2: #334155;
    --bp-muted: #5A6878;
    --bp-border: #E2E8F0;
    --bp-surface: #FAFBFD;
    --bp-canvas: #F4F6F9;
    --bp-warning-fg: #B45309;
    --bs-primary: var(--bp-primary);
    --bs-primary-rgb: var(--bp-primary-rgb);
    --bs-link-color: var(--bp-primary);
    --bs-body-color: var(--bp-ink);
    --bs-body-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", SolaimanLipi, sans-serif;
    --bs-border-color: var(--bp-border);
  }
  .btn-primary {
    --bs-btn-bg: var(--bp-primary);
    --bs-btn-border-color: var(--bp-primary);
    --bs-btn-hover-bg: #0a525b;
    --bs-btn-hover-border-color: #083f47;
  }
  .btn-outline-primary {
    --bs-btn-color: var(--bp-primary);
    --bs-btn-border-color: var(--bp-primary);
    --bs-btn-hover-bg: var(--bp-primary);
    --bs-btn-hover-border-color: var(--bp-primary);
    --bs-btn-hover-color: #fff;
  }

  body { background: var(--bp-canvas); }
  .auth-shell {
    min-height: 100vh;
    background: linear-gradient(135deg, #E6F2F4 0%, #FAFBFD 60%);
    display: flex; align-items: stretch;
  }
  .auth-brand-pane {
    flex: 1 1 45%;
    background: linear-gradient(160deg, #0F6E7A 0%, #0a525b 100%);
    color: #fff;
    padding: 3rem 4rem;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .auth-form-pane {
    flex: 1 1 55%;
    padding: 3rem 4rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--bp-surface);
  }
  .auth-form { width: 100%; max-width: 460px; }
  .auth-form h1 {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 28px; line-height: 1.2;
    letter-spacing: -0.01em; margin-bottom: 0.5rem;
  }
  .auth-form .subtitle {
    color: var(--bp-muted); margin-bottom: 1.5rem;
  }
  .auth-form .form-label {
    font-weight: 600; font-size: 14px;
    color: var(--bp-ink-2); margin-bottom: 0.35rem;
  }
  .auth-form .form-control {
    padding: 0.65rem 0.85rem;
    border-color: var(--bp-border); background: #fff;
  }
  .auth-form .form-control:focus {
    border-color: var(--bp-primary);
    box-shadow: 0 0 0 3px rgba(15, 110, 122, 0.15);
  }
  .auth-form .form-helper { color: var(--bp-muted); font-size: 12px; margin-top: 0.35rem; }
  .auth-form .btn-primary { padding: 0.7rem 1rem; font-weight: 600; }
  .auth-form .alt-link { color: var(--bp-muted); font-size: 14px; margin-top: 1.25rem; text-align: center; }
  .auth-form .alt-link a { font-weight: 600; }
  .brand-mark {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: "Inter", sans-serif; font-weight: 700; font-size: 20px;
    color: #fff; text-decoration: none;
  }
  .brand-mark .logo-dot {
    width: 12px; height: 12px;
    background: #fff; border-radius: 2px; transform: rotate(45deg);
  }
  .brand-pane-hero { max-width: 480px; }
  .brand-pane-hero h2 {
    font-family: "Inter", sans-serif; font-weight: 700;
    font-size: 32px; line-height: 1.15;
    letter-spacing: -0.015em; margin-bottom: 1rem;
  }
  .brand-pane-hero p { font-size: 16px; line-height: 1.55; opacity: 0.9; margin-bottom: 1.5rem; }
  .brand-pane-footer { font-size: 12px; opacity: 0.7; }
  .lang-toggle {
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px; padding: 0.25rem 0.6rem; font-size: 12px;
  }

  .otp-grid {
    display: grid;
    grid-template-columns: repeat(6, 56px);
    gap: 0.5rem;
    margin: 1.25rem auto 0.75rem;
    justify-content: center;
  }
  .otp-cell {
    width: 56px;
    height: 64px;
    text-align: center;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 24px;
    border: 1.5px solid var(--bp-border);
    border-radius: 8px;
    background: #fff;
    padding: 0;
  }
  .otp-cell:focus {
    outline: none;
    border-color: var(--bp-primary);
    box-shadow: 0 0 0 3px rgba(15, 110, 122, 0.15);
  }
  .otp-cell.filled {
    border-color: var(--bp-primary);
    background: var(--bp-primary-soft);
    color: var(--bp-primary);
  }

  .countdown-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .countdown-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(15, 110, 122, 0.08);
    color: var(--bp-primary);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .countdown-pill.expired {
    background: rgba(217, 119, 6, 0.12);
    color: var(--bp-warning-fg);
  }
  .countdown-pill i { font-size: 14px; }

  .resend-row {
    font-size: 14px;
    color: var(--bp-muted);
    margin-top: 0.5rem;
  }
  .resend-row a { font-weight: 600; }
  .resend-row .remaining {
    background: var(--bp-surface-2, #F0F3F7);
    color: var(--bp-muted);
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 0.25rem;
  }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- MOCKUP: 07-verify-email.html — Verify email (IA #3)            -->
<!-- Journey step: Flow A · Rimon · step 2 (post-submit transition) -->
<!-- Two visual states are shown as variants below; production      -->
<!-- swaps one of them based on countdown / resend count.           -->
<!-- ============================================================ -->
<div class="auth-shell">
  <aside class="auth-brand-pane" aria-label="Brand context">
    <header class="d-flex align-items-center justify-content-between">
      <a href="#" class="brand-mark">
        <span class="logo-dot" aria-hidden="true"></span>
        Basha Pass
      </a>
      <button type="button" class="lang-toggle" aria-label="Switch language">EN · বাংলা</button>
    </header>

    <div class="brand-pane-hero">
      <h2>One last step.</h2>
      <p>Enter the 6-digit code we sent to your email. The code expires in 5 minutes.</p>
    </div>

    <div class="brand-pane-footer">
      © 2026 Basha Pass · Free at launch · Dhaka only
    </div>
  </aside>

  <main class="auth-form-pane">
    <!-- STATE A — fresh code, countdown ticking, user mid-typing -->
    <div class="auth-form" aria-label="Verify email — active state">
      <h1>Enter your code</h1>
      <p class="subtitle">We sent a 6-digit code to <strong>rimon.khan@…gmail.com</strong>.</p>

      <form action="/accounts/verify-email/" method="post" novalidate>
        <label for="otp-1" class="form-label visually-hidden">Six-digit code</label>
        <div class="otp-grid" role="group" aria-label="Six-digit verification code">
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell filled" value="4" aria-label="Digit 1">
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell filled" value="2" aria-label="Digit 2">
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell" id="otp-3" aria-label="Digit 3" autofocus>
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell" aria-label="Digit 4" disabled>
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell" aria-label="Digit 5" disabled>
          <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" class="otp-cell" aria-label="Digit 6" disabled>
        </div>

        <div class="countdown-row">
          <span class="countdown-pill" aria-live="polite">
            <i class="bi bi-clock"></i>
            Expires in <span id="otp-countdown">3:47</span>
          </span>
        </div>

        <button type="submit" class="btn btn-primary w-100">Verify email</button>

        <p class="resend-row">
          Didn't get it? <a href="#">Resend code</a><span class="remaining">2 left</span>
        </p>
      </form>

      <p class="alt-link">
        Wrong email? <a href="06-signup.html">Start over</a>
      </p>
    </div>
  </main>
</div>

</body>
</html>
