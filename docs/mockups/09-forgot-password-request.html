<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Basha Pass — Reset password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root,
  [data-bs-theme="light"] {
    --bp-primary: #0F6E7A;
    --bp-primary-rgb: 15, 110, 122;
    --bp-primary-fg: #FFFFFF;
    --bp-primary-soft: #E6F2F4;
    --bp-ink: #0F172A;
    --bp-ink-2: #334155;
    --bp-muted: #5A6878;
    --bp-border: #E2E8F0;
    --bp-surface: #FAFBFD;
    --bp-canvas: #F4F6F9;
    --bs-primary: var(--bp-primary);
    --bs-primary-rgb: var(--bp-primary-rgb);
    --bs-link-color: var(--bp-primary);
    --bs-body-color: var(--bp-ink);
    --bs-body-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", SolaimanLipi, sans-serif;
    --bs-border-color: var(--bp-border);
  }
  .btn-primary {
    --bs-btn-bg: var(--bp-primary);
    --bs-btn-border-color: var(--bp-primary);
    --bs-btn-hover-bg: #0a525b;
  }
  body { background: var(--bp-canvas); }
  .auth-shell {
    min-height: 100vh;
    background: linear-gradient(135deg, #E6F2F4 0%, #FAFBFD 60%);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1.5rem;
  }
  .auth-card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    overflow: hidden;
  }
  .auth-card-header {
    background: var(--bp-primary-soft);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--bp-border);
    text-align: center;
  }
  .auth-card-header .brand-mark {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: "Inter", sans-serif; font-weight: 700; font-size: 18px;
    color: var(--bp-primary); text-decoration: none;
  }
  .auth-card-header .brand-mark .logo-dot {
    width: 10px; height: 10px;
    background: var(--bp-primary); border-radius: 2px; transform: rotate(45deg);
  }
  .auth-card-body { padding: 2rem; }
  .auth-card-body h1 {
    font-family: "Inter", sans-serif; font-weight: 700;
    font-size: 24px; line-height: 1.2;
    letter-spacing: -0.01em; margin-bottom: 0.5rem;
  }
  .auth-card-body .subtitle { color: var(--bp-muted); margin-bottom: 1.5rem; font-size: 15px; }
  .auth-card-body .form-label {
    font-weight: 600; font-size: 14px;
    color: var(--bp-ink-2); margin-bottom: 0.35rem;
  }
  .auth-card-body .form-control {
    padding: 0.65rem 0.85rem;
    border-color: var(--bp-border); background: #fff;
  }
  .auth-card-body .form-control:focus {
    border-color: var(--bp-primary);
    box-shadow: 0 0 0 3px rgba(15, 110, 122, 0.15);
  }
  .auth-card-body .form-helper { color: var(--bp-muted); font-size: 12px; margin-top: 0.35rem; }
  .auth-card-body .btn-primary { padding: 0.7rem 1rem; font-weight: 600; }
  .auth-card-body .alt-link { color: var(--bp-muted); font-size: 14px; margin-top: 1.25rem; text-align: center; }
  .auth-card-body .alt-link a { font-weight: 600; }

  .success-block {
    background: rgba(22, 163, 74, 0.08);
    color: #15803D;
    border: 1px solid rgba(22, 163, 74, 0.2);
    border-radius: 10px;
    padding: 1.25rem;
    text-align: center;
  }
  .success-block .icon-circle {
    width: 48px; height: 48px;
    background: rgba(22, 163, 74, 0.15);
    color: #15803D;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 0.85rem;
  }
  .success-block h2 {
    font-family: "Inter", sans-serif; font-weight: 700;
    font-size: 18px; color: #15803D;
    margin-bottom: 0.5rem;
  }
  .success-block p {
    color: var(--bp-ink-2);
    font-size: 14px;
    margin-bottom: 0;
  }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- MOCKUP: 09-forgot-password-request.html — Forgot password req  -->
<!-- Sub-flow of Login (IA #5). Anti-enumeration: success state     -->
<!-- renders identically whether or not the email exists.           -->
<!-- This mock shows the SUCCESS state (post-submit).               -->
<!-- ============================================================ -->
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-card-header">
      <a href="#" class="brand-mark">
        <span class="logo-dot" aria-hidden="true"></span>
        Basha Pass
      </a>
    </div>
    <div class="auth-card-body">
      <div class="success-block" role="status" aria-live="polite">
        <div class="icon-circle"><i class="bi bi-envelope-check"></i></div>
        <h2>Check your email</h2>
        <p>If that email exists, we sent a reset link.<br>Link expires in 1 hour.</p>
      </div>

      <p class="alt-link">
        <a href="08-login.html">← Back to Log in</a>
      </p>

      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--bp-border); font-size: 13px; color: var(--bp-muted); line-height: 1.55;">
        <strong style="color: var(--bp-ink-2);">Didn't get the email?</strong><br>
        Check spam, then wait 1–2 minutes. The link expires in 1 hour — after that, request a new one.
      </div>
    </div>
  </div>
</div>

</body>
</html>
