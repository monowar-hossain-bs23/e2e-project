{# expects: none #}
<!-- TOP NAV -->
<nav class="bp-nav sticky-top">
  <div class="container-xl py-3">
    <div class="d-flex align-items-center justify-content-between">
      <a class="bp-brand" href="/">
        <span class="bp-brand__mark">B</span>
        Basha Pass
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="bp-nav__link d-none d-lg-inline-block" href="#how">How it works</a>
        <a class="bp-nav__link d-none d-lg-inline-block" href="#stories">Stories</a>
        <a class="bp-nav__link d-none d-lg-inline-block" href="#about">About</a>
        {% if request.user.is_authenticated %}
          <span class="small fw-semibold text-secondary d-none d-sm-inline-block">{{ request.user.display_name }}</span>
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Create account</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
