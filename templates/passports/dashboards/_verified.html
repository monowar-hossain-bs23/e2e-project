<!-- Verified Tenant Dashboard Screen (Story 016) -->
<div class="bp-card mb-4" style="border-left: 4px solid var(--bp-success);">
  <div class="bp-card__body">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
      <div class="d-flex align-items-center gap-3">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: #DCFCE7; color: #15803D; display: flex; align-items: center; justify-content: center; font-size: 26px;">
          <i class="bi bi-shield-check"></i>
        </div>
        <div>
          <span class="text-uppercase fw-bold small text-success" style="letter-spacing: 0.06em;">Identity Status</span>
          <h3 class="h4 fw-bold text-dark mb-0">Verified Tenant Active</h3>
        </div>
      </div>
      <span class="bp-badge-verified">
        <i class="bi bi-patch-check-fill"></i> Full Access Unlocked
      </span>
    </div>

    <p class="text-secondary mb-4">
      Your identity credentials have been verified. You can now contact landlords directly, message other verified tenants, and post roommate listings in Dhaka.
    </p>

    <div class="d-flex align-items-center gap-3 flex-wrap">
      <a href="{% url 'listing_create' %}" class="btn btn-primary px-4 py-2 fw-semibold">
        <i class="bi bi-plus-lg me-1"></i> Post Accommodation
      </a>
      <a href="{% url 'listing_mine' %}" class="btn btn-outline-primary px-3 py-2 fw-semibold">
        <i class="bi bi-houses me-1"></i> Your Listings
      </a>
      <a href="/" class="btn btn-outline-secondary px-3 py-2">
        <i class="bi bi-search me-1"></i> Browse Flats
      </a>
      <a href="{% url 'account_settings' %}" class="btn btn-outline-secondary px-3 py-2">
        <i class="bi bi-gear me-1"></i> Account Settings
      </a>
    </div>
  </div>
</div>
